name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Validate Pak Rat catalog
        run: |
          git show HEAD^:public/pakrat/v1/storefront.json > /tmp/previous-storefront.json
          args=(--previous-catalog /tmp/previous-storefront.json)
          if ! git diff --quiet HEAD^ HEAD -- public/pakrat/v1/storefront.json; then
            args+=(--remote)
          fi
          node scripts/validate-pakrat-catalog.mjs "${args[@]}"
          node scripts/validate-pakrat-catalog-test.mjs
      - name: Build with Astro
        uses: withastro/action@v3
        with:
          # Astro 6 requires Node >=22.12; the action defaults to Node 20.
          node-version: 22
        # withastro/action installs deps, runs `astro build`, and uploads the
        # Pages artifact. It auto-detects the package manager from the lockfile.

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
